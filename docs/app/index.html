<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- `viewport-fit=cover` so the tab bar can sit in the home-indicator area on a phone, and
       `user-scalable` is deliberately NOT disabled: pinch-zoom is an accessibility control and
       taking it away fails WCAG 1.4.4 outright. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <!-- Dark-first, matching the app: the palette was designed dark and light was derived from it. -->
  <meta name="theme-color" content="#08090A" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F2F2F0" media="(prefers-color-scheme: light)">

  <!-- **The one inline stylesheet, and it exists because the real one is what is being waited on.**
       The mark below stands in for the app during the 1.26s (school) to 3.85s (band hall) before
       `styles/app.css` arrives — so it cannot be styled by it, and a `style` attribute cannot
       carry the media query that keeps it legible in both appearances. Dark ink on a dark page,
       swapped under `prefers-color-scheme: light`; without the swap the light case is #F5F5F7 on
       the browser's default white, which is a mark nobody can see standing in for an app nobody
       can see yet. Deleted from the DOM by the first render, not merely hidden. -->
  <style>
    /* **The background goes on this element and never on `html`.** It did, for one commit, and it
       took every practice-room backdrop on the web with it: the rooms are `position: fixed;
       z-index: -1` pseudo-elements, and a background on the root stops `body`'s propagating to the
       canvas — so `body` starts painting an opaque box of its own, over anything behind it. The
       door, the confirm step, the reset screen and studio setup all went flat, and the cause was a
       rule added for the loading mark two screens away. `100vh` so this still covers the viewport
       while it is the only thing on the page. */
    #boot { min-height: 100vh; background: #08090A;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 8px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #boot b { font: 700 44px/1 inherit; letter-spacing: 0.04em; color: #F5F5F7; }
    #boot span { color: #FF9F0A; }
    #boot small { font: 400 13px/1.4 inherit; color: #9C9CA6; }

    /* The dial. Twelve ticks every 30 degrees, one revolution in six seconds — `LoadingMark`'s
       own numbers, and the reasoning is beside the markup below. `--tick` and `--well` are set
       here rather than read from `tokens.css`, because that stylesheet is one of the requests
       this element exists to cover. */
    #boot-dial {
      --tick: #4A4A52; --hand: #FF9F0A; --well: #08090A;
      display: block; width: 58px; height: 58px; margin-top: 20px;
      border-radius: 50%;
      background: repeating-conic-gradient(var(--tick) 0deg 2.2deg, transparent 2.2deg 30deg);
      animation: boot-turn 6s linear infinite;
      position: relative;
      box-shadow: 0 0 34px -6px rgba(255, 159, 10, 0.28);
    }
    /* The two long markers, true vertical.

       This is what makes it the IPT mark rather than a grey ring, and the geometry is not
       invented: the artwork was measured with connected components rather than by binning pixels
       into angle buckets, and the answer was twelve ticks with both long markers on the vertical.
       Drawing that structure is what the note above meant by an argument against the artwork
       rather than against the motion — the objection was 216 KB of bitmaps on the critical path,
       and a conic gradient is neither a request nor a decode.

       Amber, because #3A3A3E on #08090A was very nearly invisible and said nothing about which
       app was loading. */
    #boot-dial::before {
      content: ""; position: absolute; inset: -5px; border-radius: 50%;
      background:
        conic-gradient(from -1.6deg, var(--hand) 0 3.2deg, transparent 3.2deg 360deg),
        conic-gradient(from 178.4deg, var(--hand) 0 3.2deg, transparent 3.2deg 360deg);
    }
    /* The well that turns the disc into a ring. A background rather than a mask: see the markup. */
    #boot-dial::after {
      content: ""; position: absolute; inset: 8px;
      border-radius: 50%; background: var(--well);
    }
    @keyframes boot-turn { to { transform: rotate(360deg); } }
    /* Still, not slower. `LoadingMark` stops the rotation outright under `reduceMotion` and the
       mark is legible standing still, so there is nothing to soften. */
    @media (prefers-reduced-motion: reduce) { #boot-dial { animation: none; } }

    @media (prefers-color-scheme: light) {
      #boot { background: #F2F2F0; }
      #boot b { color: #08090A; }
      #boot span { color: #8F5300; }
      #boot small { color: #5F5F64; }
      #boot-dial {
        --tick: #B8B8B2; --hand: #8F5300; --well: #F2F2F0;
        box-shadow: 0 0 30px -8px rgba(143, 83, 0, 0.22);
      }
    }
  </style>
  <title>IPT: Individual Practice Time</title>
  <!-- **The claim this product does not make.** "Proof it happened" was removed from the landing
       page and from the manifest, and survived here because nothing read this file. `0010_self_reported.sql`
       says a written-down session "is not a security control and nothing here pretends otherwise". -->
  <meta name="description" content="An instructor assigns the practice, a performer records how it went, and hears it back.">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- iOS ignores the manifest's icons for "Add to Home Screen" and reads this instead. Without it
       a performer whose school blocks the App Store gets a screenshot of the page as their icon. -->
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- The tab strip, which reads none of the above: a manifest icon is for an installed app and
       `apple-touch-icon` is for a home screen, so this had no face in a browser at all. On a
       Chromebook IPT *is* a tab, sitting next to a row of applications that all have one — and a
       tab is found by colour and silhouette rather than by reading it. Generated by
       `Tools/build_web_favicons.py`; 8.9 KB for all three. -->
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <!-- The first thing a keyboard or screen-reader user meets. WCAG 2.4.1: without it, every
       keyboard user tabs through the whole tab bar on every route change to reach the content. -->
  <a class="skip-link" href="#main">Skip to content</a>

  <div id="app">
    <!-- **Measured: this was a blank rectangle for 1.26s on school wi-fi and 3.85s in a band
         hall.** The comment below said the page "says something before any JavaScript runs", and
         it did not: `<noscript>` renders nothing at all when scripts are on, which is every real
         visit. iOS shows its dial for exactly this window; the web showed the background colour.

         Not a port of that dial. The iOS mark is 216 KB of bitmaps, so putting it here would make
         the wait it covers *longer* — the one thing a loading state must never do. This is the
         same wordmark as text: no request, no decode, no bytes on the critical path, painted with
         the first frame of HTML.

         Inline styles rather than a class, because `styles/app.css` is itself one of the requests
         being waited on and a mark that arrives unstyled is worse than none. Replaced wholesale by
         `replaceChildren` on first render, so it cannot outlive the thing it stands in for.

         **And now the dial, which is not a spinner and the difference is the speed.** The
         paragraph here used to end "no spinner and no animation — a spinner claims progress this
         page cannot measure", which is right about a spinner and wrong about what iOS draws.
         `LoadingMark` turns **once every six seconds**: twelve markers at one a half-second, a
         beat at 120, and its own comment says what keeps it from being a `ProgressView` in
         costume is exactly that speed. It is a dial keeping time, not a claim about progress, and
         the web had no reason to be the client without it.

         Drawn in CSS rather than ported. The objection above stands — 216 KB of bitmaps on the
         critical path would make the wait they cover *longer*, which is the one thing a loading
         state must never do — but it was an argument against the **artwork**, not against the
         motion. Twelve ticks are a `repeating-conic-gradient` and a rotation: no request, no
         decode, and it paints with the first frame like the wordmark beside it.

         Two circles rather than a mask, deliberately. `mask` is a decade old and still the kind of
         thing a managed Chromebook is a version behind on, and its failure mode here is a filled
         disc rather than a ring — a broken shape on the first thing anybody sees. The inner circle
         is a plain background in the boot colour, which cannot fail that way.

         Still under `prefers-reduced-motion`, which is what `LoadingMark` does with
         `reduceMotion` and for the same reason. -->
    <div id="boot" role="status">
      <b>IP<span>T</span></b>
      <small>Individual Practice Time</small>
      <i id="boot-dial" aria-hidden="true"></i>
    </div>
    <noscript>
      <p class="prose">IPT needs JavaScript to run. The iPhone app does not — it is on the App Store.</p>
    </noscript>
  </div>

  <!-- One live region for the whole app. Route changes and role switches announce here, because a
       screen reader is given no notice at all when a single-page app replaces its own content. -->
  <p id="announcer" class="visually-hidden" role="status" aria-live="polite"></p>

  <script type="module" src="app/main.js"></script>
</body>
</html>
